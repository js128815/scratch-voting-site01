services:
  - type: web
    name: wave-room-chat
    runtime: ruby
    rootDir: chatroom-app
    plan: starter
    buildCommand: gem install bundler -v 2.5.23 && bundle _2.5.23_ install
    startCommand: bundle _2.5.23_ exec ruby server.rb
    envVars:
      - key: STORAGE_ROOT
        value: /opt/render/project/src/chatroom-app/storage
    disk:
      name: wave-room-storage
      mountPath: /opt/render/project/src/chatroom-app/storage
      sizeGB: 1
