services:
  - type: web
    name: wave-room-chat
    runtime: ruby
    rootDir: chatroom-app
    plan: starter
    buildCommand: echo "No build step"
    startCommand: ruby server.rb
    envVars:
      - key: STORAGE_ROOT
        value: /opt/render/project/src/chatroom-app/storage
    disk:
      name: wave-room-storage
      mountPath: /opt/render/project/src/chatroom-app/storage
      sizeGB: 1
